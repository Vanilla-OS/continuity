name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    permissions:
        contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -o continuity -ldflags="-X 'main.Version=${VERSION}'"
          tar -czvf continuity-amd64.tar.gz continuity
          GOARCH=arm64 go build -o continuity -ldflags="-X 'main.Version=${VERSION}'"
          tar -czvf continuity-arm64.tar.gz continuity

      - name: Calculate and Save Checksums
        run: sha256sum continuity*.tar.gz >> checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: continuity
          path: |
            continuity*.tar.gz
            checksums.txt

  release:
    runs-on: ubuntu-latest
    needs: build-artifacts
    permissions:
      contents: write # to create and upload assets to releases
      attestations: write # to upload assets attestation for build provenance
      id-token: write # grant additional permission to attestation action to mint the OIDC token permission

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: continuity

      - name: Create Release
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes continuity*.tar.gz checksums.txt

      - name: Attest Release Files
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'continuity*.tar.gz, checksums.txt'
